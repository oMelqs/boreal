<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060B12"/>
      <stop offset="0.55" stop-color="#0A1017"/>
      <stop offset="1" stop-color="#101E2E"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#night)"/>

  <!-- estrelas -->
  <g fill="#E9F1F7">
    <circle cx="176" cy="196" r="7" opacity="0.9"/>
    <circle cx="356" cy="120" r="4" opacity="0.55"/>
    <circle cx="836" cy="176" r="6" opacity="0.8"/>
    <circle cx="700" cy="96" r="3.5" opacity="0.5"/>
    <circle cx="920" cy="330" r="4" opacity="0.5"/>
    <circle cx="120" cy="420" r="4.5" opacity="0.45"/>
    <circle cx="540" cy="180" r="3" opacity="0.4"/>
    <circle cx="260" cy="312" r="3" opacity="0.35"/>
  </g>

  <!-- cortina de aurora: linguagem do AuroraStrip, inclinada -->
  <g transform="rotate(-18 512 620)" filter="url(#glow)">
    <rect x="192" y="560" width="560" height="72" rx="36" fill="#3DDC97"/>
    <rect x="288" y="668" width="424" height="72" rx="36" fill="#53C7E8" opacity="0.95"/>
    <rect x="384" y="776" width="296" height="72" rx="36" fill="#8B7CF6" opacity="0.9"/>
  </g>
</svg>
