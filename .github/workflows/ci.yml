name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Resumo de cobertura
        run: |
          node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const row = (k) => '| ' + k + ' | ' + t[k].pct + '% (' + t[k].covered + '/' + t[k].total + ') |';
          console.log(['## Cobertura de testes', '', '| Métrica | Cobertura |', '| --- | --- |',
            row('statements'), row('branches'), row('functions'), row('lines')].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
